<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Growth and customer journey dashboard</title><desc id="desc">A growth planning board connecting useful content, customer experience, and measurable conversion progress.</desc>
