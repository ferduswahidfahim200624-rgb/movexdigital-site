<g font-family="Arial,sans-serif"><path d="M360 414h53m0 0 13-12m-13 12 13 12" fill="none" stroke="#91b6a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="442" y="303" width="265" height="75" rx="15" fill="#fff" stroke="#dfe8e2" stroke-width="2"/><circle cx="477" cy="340" r="16" fill="#e9f4ed"/><text x="477" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#168447">1</text><text x="508" y="335" font-size="15" font-weight="700" fill="#162b43">Route to the right CRM</text><text x="508" y="356" font-size="12" fill="#748195">Assign owner and record the source</text><path d="M707 340h45m0 0 13-12m-13 12 13 12" fill="none" stroke="#91b6a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="778" y="303" width="280" height="75" rx="15" fill="#fff5e4" stroke="#f0ddb7" stroke-width="2"/><circle cx="813" cy="340" r="16" fill="#fea61a"/><text x="813" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#102541">2</text><text x="844" y="335" font-size="15" font-weight="700" fill="#162b43">Send a timely response</text><text x="844" y="356" font-size="12" fill="#748195">Helpful confirmation and follow-up</text><path d="M918 378v52H756" fill="none" stroke="#91b6a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><rect x="442" y="438" width="265" height="75" rx="15" fill="#fff" stroke="#dfe8e2" stroke-width="2"/><circle cx="477" cy="475" r="16" fill="#e9f4ed"/><text x="477" y="481" text-anchor="middle" font-size="15" font-weight="700" fill="#168447">3</text><text x="508" y="470" font-size="15" font-weight="700" fill="#162b43">Keep the team aligned</text><text x="508" y="491" font-size="12" fill="#748195">Tasks, reminders and clear handoffs</text><rect x="778" y="438" width="280" height="75" rx="15" fill="#eaf4ed" stroke="#cfe3d5" stroke-width="2"/><circle cx="813" cy="475" r="16" fill="#168447"/><path d="m806 475 5 5 10-12" fill="none" stroke="#fff" stroke-widt