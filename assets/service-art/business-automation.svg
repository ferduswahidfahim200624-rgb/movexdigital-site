<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Connected business automation workflow</title><desc id="desc">A lead intake moves through CRM, support and follow-up automation with clear human review points.</desc>
